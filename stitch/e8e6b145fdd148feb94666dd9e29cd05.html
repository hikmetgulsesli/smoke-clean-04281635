<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MONOLITH - İşlem Geçmişi</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#4edea3",
                        "on-background": "#dae2fd",
                        "tertiary-fixed-dim": "#ffb786",
                        "inverse-surface": "#dae2fd",
                        "outline": "#8c909f",
                        "on-secondary-fixed": "#002113",
                        "on-surface": "#dae2fd",
                        "background": "#0b1326",
                        "surface-container-low": "#131b2e",
                        "primary-fixed-dim": "#adc6ff",
                        "inverse-on-surface": "#283044",
                        "on-tertiary-container": "#461f00",
                        "on-surface-variant": "#c2c6d6",
                        "surface-variant": "#2d3449",
                        "primary-container": "#4d8eff",
                        "tertiary-container": "#df7412",
                        "surface-container-lowest": "#060e20",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#004395",
                        "surface": "#0b1326",
                        "on-secondary-container": "#00311f",
                        "on-secondary-fixed-variant": "#005236",
                        "error-container": "#93000a",
                        "surface-container": "#171f33",
                        "on-primary": "#002e6a",
                        "surface-container-highest": "#2d3449",
                        "outline-variant": "#424754",
                        "on-tertiary": "#502400",
                        "on-primary-container": "#00285d",
                        "on-primary-fixed": "#001a42",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary": "#003824",
                        "surface-container-high": "#222a3d",
                        "secondary": "#4edea3",
                        "tertiary": "#ffb786",
                        "tertiary-fixed": "#ffdcc6",
                        "inverse-primary": "#005ac2",
                        "secondary-fixed": "#6ffbbe",
                        "primary": "#adc6ff",
                        "secondary-container": "#00a572",
                        "surface-tint": "#adc6ff",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-tertiary-fixed": "#311400"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden selection:bg-primary/30">
<!-- UNDERLAY: Mock Home Page Canvas -->
<div class="relative z-0 h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#0b1326] w-full sticky top-0 z-50 flex justify-between items-center px-6 py-4 max-w-full shadow-none border-none">
<div class="text-xl font-bold tracking-tighter text-[#adc6ff] uppercase">MONOLITH</div>
<div class="flex items-center gap-4 hidden">
<span class="material-symbols-outlined text-[#adc6ff] hover:bg-[#171f33] transition-colors p-2 rounded-full cursor-pointer active:scale-95 transition-transform" data-icon="history">history</span>
<span class="material-symbols-outlined text-[#adc6ff] hover:bg-[#171f33] transition-colors p-2 rounded-full cursor-pointer active:scale-95 transition-transform" data-icon="contrast">contrast</span>
</div>
</header>
<!-- Main Content Area (Blurred/Faded out for context) -->
<main class="flex-1 flex flex-col items-center justify-center p-6 opacity-30 blur-[2px] pointer-events-none">
<div class="text-[8rem] font-display font-bold text-primary leading-none tracking-tighter">42</div>
<div class="mt-8 text-on-surface-variant font-body text-lg">Aktif Sayaç Değeri</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-[#171f33]/60 backdrop-blur-3xl fixed bottom-0 w-full rounded-t-[24px] border-t border-[#adc6ff]/15 shadow-[0_-8px_40px_rgba(173,198,255,0.08)] fixed bottom-0 left-0 w-full z-10 flex justify-around items-center px-4 pb-8 pt-4 md:hidden">
<button class="flex flex-col items-center justify-center text-[#adc6ff]/40 px-6 py-2 hover:text-[#adc6ff] transition-all">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="add_circle">add_circle</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Sayaç</span>
</button>
<button class="flex flex-col items-center justify-center text-[#adc6ff] bg-[#adc6ff]/10 rounded-xl px-6 py-2 active:scale-95 duration-200">
<span class="material-symbols-outlined mb-1 text-2xl" data-icon="history" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Geçmiş</span>
</button>
</nav>
</div>
<!-- OVERLAY: Modal Backdrop & Dialog -->
<div aria-labelledby="modal-title" aria-modal="true" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" role="dialog">
<!-- Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-background/80 backdrop-blur-md transition-opacity"></div>
<!-- Modal Dialog (Glassmorphism, No-Line, Monolithic Pulse) -->
<div class="relative w-full max-w-lg transform overflow-hidden rounded-xl bg-surface-bright/60 backdrop-blur-3xl text-left shadow-[0_8px_40px_rgba(173,198,255,0.08)] transition-all flex flex-col max-h-[870px]">
<!-- Modal Header -->
<div class="px-6 py-5 flex items-center justify-between">
<h3 class="text-2xl font-headline font-semibold text-on-surface tracking-tight" id="modal-title">İşlem Geçmişi</h3>
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-container-low focus:outline-none" type="button">
<span class="material-symbols-outlined text-2xl" data-icon="close">close</span>
</button>
</div>
<!-- Modal Content (Transaction List) -->
<div class="flex-1 overflow-y-auto px-6 pb-6 space-y-3">
<!-- Transaction Item: Increased -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg transition-transform hover:scale-[1.01]">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-secondary/10 text-secondary">
<span class="material-symbols-outlined" data-icon="add">add</span>
</div>
<div>
<p class="text-base font-body font-medium text-on-surface">Artırıldı <span class="text-secondary ml-1">(+1)</span></p>
<p class="text-sm font-label text-on-surface-variant mt-0.5">14:30</p>
</div>
</div>
<div class="text-right">
<p class="text-sm text-on-surface-variant mb-0.5">Yeni Değer</p>
<p class="text-xl font-display font-bold text-on-surface">42</p>
</div>
</div>
<!-- Transaction Item: Decreased -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg transition-transform hover:scale-[1.01]">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-outline-variant/30 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</div>
<div>
<p class="text-base font-body font-medium text-on-surface">Azaltıldı <span class="text-on-surface-variant ml-1">(-1)</span></p>
<p class="text-sm font-label text-on-surface-variant mt-0.5">12:15</p>
</div>
</div>
<div class="text-right">
<p class="text-sm text-on-surface-variant mb-0.5">Yeni Değer</p>
<p class="text-xl font-display font-bold text-on-surface">41</p>
</div>
</div>
<!-- Transaction Item: Reset -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg transition-transform hover:scale-[1.01]">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-tertiary-container/20 text-tertiary-fixed-dim">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
</div>
<div>
<p class="text-base font-body font-medium text-on-surface">Sıfırlandı</p>
<p class="text-sm font-label text-on-surface-variant mt-0.5">Dün, 09:00</p>
</div>
</div>
<div class="text-right">
<p class="text-sm text-on-surface-variant mb-0.5">Yeni Değer</p>
<p class="text-xl font-display font-bold text-on-surface">0</p>
</div>
</div>
<!-- Transaction Item: Increased -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg transition-transform hover:scale-[1.01]">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-secondary/10 text-secondary">
<span class="material-symbols-outlined" data-icon="add">add</span>
</div>
<div>
<p class="text-base font-body font-medium text-on-surface">Artırıldı <span class="text-secondary ml-1">(+1)</span></p>
<p class="text-sm font-label text-on-surface-variant mt-0.5">14 Haz, 18:45</p>
</div>
</div>
<div class="text-right">
<p class="text-sm text-on-surface-variant mb-0.5">Yeni Değer</p>
<p class="text-xl font-display font-bold text-on-surface">15</p>
</div>
</div>
<!-- Spacer for scroll visual breathing room -->
<div class="h-2"></div>
</div>
<!-- Modal Footer (Action) -->
<div class="p-6 pt-2 bg-surface-bright/40">
<button class="w-full flex items-center justify-center gap-3 py-4 px-6 rounded bg-error-container text-on-error-container font-headline font-semibold text-base transition-transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface-bright" type="button">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
                    Geçmişi Temizle
                </button>
</div>
</div>
</div>
</body></html>
