<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Monolith - Sayaç</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#4edea3",
                        "on-background": "#dae2fd",
                        "tertiary-fixed-dim": "#ffb786",
                        "inverse-surface": "#dae2fd",
                        "outline": "#8c909f",
                        "on-secondary-fixed": "#002113",
                        "on-surface": "#dae2fd",
                        "background": "#0b1326",
                        "surface-container-low": "#131b2e",
                        "primary-fixed-dim": "#adc6ff",
                        "inverse-on-surface": "#283044",
                        "on-tertiary-container": "#461f00",
                        "on-surface-variant": "#c2c6d6",
                        "surface-variant": "#2d3449",
                        "primary-container": "#4d8eff",
                        "tertiary-container": "#df7412",
                        "surface-container-lowest": "#060e20",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#004395",
                        "surface": "#0b1326",
                        "on-secondary-container": "#00311f",
                        "on-secondary-fixed-variant": "#005236",
                        "error-container": "#93000a",
                        "surface-container": "#171f33",
                        "on-primary": "#002e6a",
                        "surface-container-highest": "#2d3449",
                        "outline-variant": "#424754",
                        "on-tertiary": "#502400",
                        "on-primary-container": "#00285d",
                        "on-primary-fixed": "#001a42",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary": "#003824",
                        "surface-container-high": "#222a3d",
                        "secondary": "#4edea3",
                        "tertiary": "#ffb786",
                        "tertiary-fixed": "#ffdcc6",
                        "inverse-primary": "#005ac2",
                        "secondary-fixed": "#6ffbbe",
                        "primary": "#adc6ff",
                        "secondary-container": "#00a572",
                        "surface-tint": "#adc6ff",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-tertiary-fixed": "#311400"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        /* Specific adjustments for Turkish chars based on design system */
        .font-display { line-height: 1.2; }
        .font-headline { line-height: 1.3; }
        
        /* The glow effect for the primary button */
        .glow-effect:hover {
            box-shadow: 0 0 30px rgba(173, 198, 255, 0.4);
        }
    </style>
</head>
<body class="bg-surface-dim text-on-surface min-h-screen flex flex-col font-body selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<nav class="w-full sticky top-0 z-50 bg-[#0b1326] flex justify-between items-center px-6 py-4 max-w-full">
<div class="text-xl font-bold tracking-tighter text-[#adc6ff] uppercase font-headline">MONOLITH</div>
<div class="flex items-center gap-4">
<button class="text-[#adc6ff] hover:bg-[#171f33] transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">history</span>
</button>
<button class="text-[#adc6ff] hover:bg-[#171f33] transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">contrast</span>
</button>
</div>
</nav>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pb-32">
<!-- The Monolithic Container -->
<div class="bg-surface-container-low rounded-lg flex flex-col items-center p-[24px] shadow-[0_8px_40px_rgba(173,198,255,0.03)] w-full max-w-md">
<h2 class="font-headline font-semibold text-lg text-on-surface-variant tracking-wide">
                Genel Sayaç
            </h2>
<!-- The Hero Monolith Value -->
<div class="font-display font-bold text-8xl md:text-9xl text-primary my-[48px] tracking-tighter drop-shadow-[0_0_20px_rgba(173,198,255,0.1)]">
                42
            </div>
<!-- Contextual Timestamp -->
<div class="font-label text-sm text-on-surface-variant/70 bg-surface-dim px-4 py-1.5 rounded-full">
                Son güncelleme: 14:32
            </div>
</div>
<!-- Action Controls -->
<div class="flex items-center gap-6 mt-16">
<!-- Decrease (-) -->
<button class="bg-surface-container-highest text-on-surface w-16 h-16 rounded flex items-center justify-center hover:bg-surface-bright transition-colors active:scale-95">
<span class="material-symbols-outlined text-3xl">remove</span>
</button>
<!-- Primary Action (+) -->
<button class="bg-gradient-to-tr from-primary to-primary-container text-on-primary w-24 h-24 rounded flex items-center justify-center shadow-[0_4px_20px_rgba(173,198,255,0.15)] glow-effect transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
<!-- Reset (Sıfırla) -->
<button class="bg-surface-container-highest text-on-surface px-8 h-16 rounded flex items-center justify-center hover:bg-surface-bright transition-colors active:scale-95 font-body font-medium tracking-wide">
                Sıfırla
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#171f33]/60 backdrop-blur-3xl rounded-t-[24px] border-t border-[#adc6ff]/15 shadow-[0_-8px_40px_rgba(173,198,255,0.08)]">
<!-- Active Nav Item -->
<a class="flex flex-col items-center justify-center text-[#adc6ff] bg-[#adc6ff]/10 rounded-xl px-6 py-2 active:scale-95 duration-200 hover:text-[#adc6ff] transition-all group" href="#">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Sayaç</span>
</a>
<!-- Inactive Nav Item -->
<a class="flex flex-col items-center justify-center text-[#adc6ff]/40 px-6 py-2 hover:text-[#adc6ff] transition-all group" href="#">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">history</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Geçmiş</span>
</a>
</nav>
</body></html>
